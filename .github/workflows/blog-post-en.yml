name: Auto-publish EN article (pipeline v3 — language-split)

# ============================================================
# PIPELINE V3 (2026-08-27) — one workflow per language, one
#   article per run, independent concurrency groups.
#
# PHASE 157 (SEO-GEO-5.0, owner «نفذ توصيتك» = Proposal 1):
#   BILINGUAL PAIRING — ONE daily topic produces TWO queue rows
#   (en + ar) sharing pair_id + a sealed sharedBrief. Each
#   language STILL executes its FULL P1→P5 pipeline by itself,
#   written from scratch (topic + shared angle only — never
#   translation) in its own window below. When the later twin
#   publishes, P5 fills linked_post_id BOTH ways → blog hreflang
#   + LanguageToggle light up per pair. Any pairing failure
#   degrades to the exact legacy independent-row behavior.
#
# PHASE 119 (owner directive 2026-09-04): exactly ONE EN article
#   per day + ONE AR article per day, at DIFFERENT times, each
#   anchored to its audience's geography (EN → US Eastern · AR →
#   Cairo — the 2026-08-27 owner-approved anchors). Of the three
#   former EN windows the EVENING one is kept: max spread from the
#   AR morning slot (05:00 UTC vs 22:00 UTC = 17h apart).
#
# ENGLISH DAILY SLOT:
#   cron (UTC)     US Eastern (EDT, UTC-4)   Rationale
#   22:00    →     18:00 ET                  after-work / evening peak
#   NOTE: when the US drops DST in winter (EST, UTC-5), the local time
#   shifts one hour EARLIER (17:00) — still the evening peak.
#
# Env PIPELINE_LANG=en is REQUIRED — P0 refuses to guess the language.
# AI chain: OpenRouter dual-key pool + Groq interleaved strongest-first,
# automatic fall-through. P5 publish is pure code (NO AI).
# ============================================================

on:
  schedule:
    - cron: "0 22 * * *"  # 18:00 ET (EDT) — the single daily EN slot (Phase 119)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional coach topic override (Phase 162: >=10 chars seals into the shared brief; empty = research picks)"
        required: false
        default: ""
      job_id:
        description: "ai_jobs receipt id (coach traceability echo only)"
        required: false
        default: ""

# SCHEDULE-RE-REGISTRATION 2026-08-27: GitHub silently stopped firing ALL
# scheduled workflows repo-wide after 2026-08-26T16:39Z (dispatch runs kept
# working). Remedy per AGENTS.md §8 SCHEDULE HEALTH LAW: API enable + this
# touching commit to re-register the cron triggers with the scheduler.
#
# BLOG-RECOVERY 2026-10-16 (RC1 — the migration half-step): this workflow
# was created with the repo (2026-10-09 cutover) in disabled_manually
# state and NEVER enabled — the 2026-10-10 cron re-registration commit
# (48223360) covered the 12 ops workflows but omitted the blog pair, so
# production blog posts stopped at 2026-10-01 while the FROZEN old repo
# (muscleshubfit-cpu/alkemos) kept firing this pipeline daily against
# its retired tree (every run failing at P0 — quota 429 — burning
# Actions minutes + Gemini quota). Remedy: API enable on BOTH blog
# workflows + this touching commit (§8) + disable_manually on the old
# repo's pair (the same retirement pattern every ops job followed at
# cutover). See docs/BLOG-PIPELINE-RECOVERY-2026-10-16.md for the full
# forensics.
concurrency:
  # Independent of the AR pipeline on purpose — AR and EN may overlap.
  group: blog-pipeline-en
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # ── Language identity for this pipeline ──
      PIPELINE_LANG: "en"

      # ── Native-execution budget override (default on Vercel: 52000) ──
      # R3 (Execution-Path Audit 2026-09-29): 360000 → 480000 — funds the
      # third P2 chain entry (480/3 = 160s ≥ the 150s caller timeout) and
      # widens the P4 windows. Precedent: process-ai-jobs.yml has run 480000
      # since Phase 161.4; the job timeout (120min) is untouched.
      # BLOG-PROVIDER-FAILOVER 2026-10-16 (live run 38851515578): 480000 →
      # 600000 — every non-gemini P4-review entry aborted at the 110s cap on
      # the ~11.8k-token review payload while gemini answered 503/429; the
      # review's real CoT window needs 600s/4 = 150s per entry. Rollback:
      # 600000 → 480000.
      AI_CHAIN_TOTAL_BUDGET_MS: "600000"

      # ── BLOG-PROVIDER-FAILOVER 2026-10-16 (owner order «بحيث تنتقل
      # للمزوّد التالي عند نفاد الحصة … وتجنب تكرار المحاولات الفاشلة») ──
      # Quota-cooldown window: exhaustion-class provider failures (429/402/
      # 401/403/404) cool the failed provider/key×model for 30 minutes and
      # the chain/grounded walk SKIPS it without consuming attempt budget —
      # the next healthy provider takes the slot, and the futile 429 re-walk
      # inside one run collapses to an instant honest skip. Rollback (zero
      # code): remove this env line, or set AI_PROVIDER_COOLDOWN=0.
      AI_PROVIDER_COOLDOWN_MS: "1800000"

      # ── PHASE 162: coach pipeline parity — optional topic override ──
      # Set ONLY by workflow_dispatch runs the coach triggered from the
      # articles dashboard; the 22:00 UTC scheduled run never carries them
      # (empty inputs), so automatic behavior stays byte-identical.
      PIPELINE_TOPIC: ${{ github.event.inputs.topic || '' }}
      PIPELINE_JOB_ID: ${{ github.event.inputs.job_id || '' }}

      # ── Required secrets (preflight fails fast naming missing ones) ──
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      # ── TAVILY SEARCH ARM (PHASE 5-A, owner order 2026-10-31 — §10-أ) ──
      # The FIRST arm of the §6-أ grounded-search ladder (tavily → groq →
      # gemini dormant). The secret EXISTS in repo Actions secrets since the
      # Phase-3 live battery; it is now consumed by the production blog
      # P0 research (callTavilySearch — basic search = 1 credit of the free
      # Researcher plan's 1000/month; NO paid service, no card). Missing/
      # empty → the arm fails honestly and the walk falls to groq (no
      # preflight: an optional arm, exactly like the gemini tail).
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # ── GEMINI (Phase 343 arm — first-priority law CANCELLED 2026-10-31,
      #    Phase 5-A owner order «إلغاء قانون Gemini-First نهائيًا») ──
      # Optional BY DESIGN: gemini rides BOTH generation chains as an
      # ordinary TAIL entry (never a lead — the 3-way rotation leads) and
      # the grounded walk's DORMANT LAST arm. Missing/empty → the entries
      # are skipped without consuming attempt budget (no preflight).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # BLOG-RECOVERY 2026-10-16 (RC2 relief): optional SECOND free-tier
      # Google AI key — Gemini bills the Google-Search grounding quota
      # PER PROJECT, so a second key (new project) = an independent
      # grounded bucket. Empty/absent secret → single-key behavior.
      # Consumed by the dormant grounded-search arm in
      # callGeminiGroundedSearch (P0 research last resort).
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      # Gemini usage counters (weekly report source) — optional, fail-soft.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # ── IMAGE SOURCE LAW v3 (Pexels-first real photography) ──
      # PEXELS_API_KEY = PRIMARY (required per law v3); Unsplash/Pixabay
      # = failover. Pollinations/AI generation RETIRED by law v3 —
      # these three stock keys are the only image sources.
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - name: Preflight — required secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight [EN pipeline]: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CRON_SECRET GROQ_API_KEY NVIDIA_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              echo "   → add it under: Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing AI provider key — provide a secret named OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ All required secrets present · language=$PIPELINE_LANG"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          # Node 22 REQUIRED: supabase-js realtime needs the stable global
          # WebSocket that only exists from Node 22+ (2026-08-27 P0 crash).
          node-version: 22

      # PHASE 141 (A-12) — production-locked install: bun reads the SAME
      # bun.lock Vercel and local dev build from, killing the npm
      # fresh-re-resolution drift class (and the 2026-09-03 npm-10
      # arborist crash + npm-11 workaround that fought it). Node stays
      # the RUNTIME — the tsx/npx steps below are unchanged.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      # ══════════════════════════════════════════════════════════
      # SIX-PHASE PIPELINE — ENGLISH ONLY (each step retries ×3 with
      # backoff and threads queueId automatically from P0's response;
      # lang is threaded from PIPELINE_LANG by run-step.sh)
      # ══════════════════════════════════════════════════════════

      - name: P0 — Keyword & topic research EN (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p0-research 3

      - name: P1 — Topic choice + outline EN (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p1-outline 3

      - name: P2 — Full content EN, 1500–2500 words (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p2-content 3

      - name: P3 — Modesty-guarded images EN, 3–5 (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p3-images 3

      - name: P4 — Quality review & links & CTA EN (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p4-review 3

      - name: P5 — Publish to blog_posts + auto-sitemap (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p5-publish 3

      - name: Summary
        if: always()
        run: |
          echo "=== EN pipeline run summary ==="
          echo "PIPELINE_LANG: $PIPELINE_LANG"
          echo "QUEUE_ID processed: ${QUEUE_ID:-<none>}"
          echo "Topic override: ${PIPELINE_TOPIC:-<none — research picked>}"
          echo "Coach receipt (ai_jobs): ${PIPELINE_JOB_ID:-<automatic scheduled run>}"
          # R5 (Execution-Path Audit §10 Phase R5, 2026-09-30): the run's
          # repair-loop line — how many in-run repair cycles saved/retried
          # this row before publish/markFailed (exported by run-step.sh).
          echo "R1 repair-loop cycles this run: ${REPAIRS_USED:-0} (cumulative counter: /api/ai/queue-health \"repair\")"
          echo "Full logs above — green ✓ = published (EN), red ❌ = copy last lines and report."
