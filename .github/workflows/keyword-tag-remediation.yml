name: Keyword/tag remediation (P1 batch 14 — dispatch-only)

# ============================================================
# P1 BATCH 14 (owner order 2026-11-06 «راجع جميع المقالات المنشورة…
# وصحح المعلومات»): converge the stored blog rows' keywords/tags to
# topical relevance. The measured defect (batch 13, corpus audit):
# the legacy generator's random pools — 99 rows with orphan keywords
# (446 entries) + 113 rows with orphan tags (276 entries) + 18
# zero-keyword rows — polluting the on-site search predicate
# (matchesBlogSearch matches on keywords+tags).
#
# LAW: scripts/blog-runner/keyword-tag-remediation.mts writes ONLY
# keywords + tags (metadata-only — never content/meta/slug/faq/publish
# state, and NO updated_at bump: keywords/tags never render, so the
# honest-lastmod law D-4 forbids claiming a visible change). Every
# replacement is validated against the LIVE row's own topical basis
# (title + category + focus_keyword + H2 headings + FAQ questions)
# by the shared detector (src/lib/blog-keyword-relevance.ts) BEFORE
# any write; a failing entry refuses individually. Idempotent — rows
# already equal to the patch are skipped, re-runs converge to a no-op.
#
# Dispatch with dry_run (default) first, then apply.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN — report + validation only, zero DB writes"
        type: boolean
        default: true
      slugs:
        description: "Comma-separated slug allowlist (empty = the whole patch file)"
        type: string
        default: ""

concurrency:
  group: keyword-tag-remediation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Keyword/tag remediation (validated before any write)
        run: npx --no-install tsx scripts/blog-runner/keyword-tag-remediation.mts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && '0' || '1' }}
          SLUGS: ${{ github.event.inputs.slugs }}

      - name: Summary
        if: always()
        run: echo "Keyword/tag remediation finished — see the per-slug report above."
