# WHY: F3-a — food catalog CI build pipeline (owner order 2026-11-28
# «نفّذ البند التالي غير المنفّذ... ابدأ بـ F3-أ» — the Wave-1 opening
# item of docs/opencalory-integration-review-2026-11-28/04-PHASED-PLAN-AR.md).
#
# What it does (GitHub Actions ONLY — the frame's acceptance criterion 1:
# this pipeline NEVER runs on the production origin — the 1GB Lightsail
# instance — and is never wired into deploy-aws.yml):
#   1. Runs the forked catalog build (scripts/food-catalog/build.ts —
#      the six adapters, upstream open datasets only, no secrets)
#      producing the SQLite catalog + manifest.
#   2. Quality-checks the package with the forked Rust tool
#      (tools/catalog-dedup audit — read-only deep audit, JSON report).
#   3. Exports the importable data-only SQL file (export-sql.ts) for the
#      F3-b Supabase migration + validates ALL acceptance criteria
#      (validate.ts): count vs the documented reference ± documented
#      deviation band, zero critical-missing rows, idempotent replay,
#      deterministic export, SQL size cap.
#   4. Uploads the artifacts for the F3-b frame (SQL + db.gz + reports).
#
# Cost note: a full run is a heavyweight build (~tens of billable minutes
# on the 2-core/8GB private-repo runner). It fires on pushes that touch
# the pipeline itself (proving itself through a real run) and on manual
# dispatch — never on a schedule (a cadence would be an owner decision).
name: Food catalog build (F3-a)

on:
  workflow_dispatch:
    inputs:
      expected_count:
        description: 'Reference food count (documented deviation is measured against it)'
        type: number
        default: 130362
      max_deviation_pct:
        description: 'Hard deviation band in percent (default 20 — see scripts/food-catalog/README.md)'
        type: number
        default: 20
  push:
    branches: [main]
    paths:
      - 'scripts/food-catalog/**'
      - '.github/workflows/food-catalog-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/food-catalog/**'
      - '.github/workflows/food-catalog-build.yml'

concurrency:
  group: food-catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit
        with:
          bun-version: 1.3.14

      # The fork is a self-contained package (its own package.json +
      # bun.lock) — the ROOT package.json/bun.lock stay untouched, so this
      # frame stays docs/tooling-only for the deploy pipeline (paths-ignore).
      - name: Install pipeline dependencies (frozen fork lockfile)
        run: bun install --frozen-lockfile
        working-directory: scripts/food-catalog

      - name: Typecheck the pipeline (tsc --noEmit)
        run: bunx tsc --noEmit
        working-directory: scripts/food-catalog

      # CI-ONLY LAW (acceptance criterion 1): the whole build lives here on
      # GitHub's runner — the production origin (1GB Lightsail) never runs
      # it. --smol keeps the peak heap down for the big dataset (the VACUUM
      # phase peaks in the multi-GB range on the full dataset).
      - name: Build the catalog (six adapters → dedup → SQLite + manifest)
        run: bun --smol build.ts --tier=core
        working-directory: scripts/food-catalog

      # Rust quality gate — the forked catalog-dedup tool (read-only deep
      # audit). cargo is preinstalled on the ubuntu runner image; a
      # release build of the bundled rusqlite takes a few minutes.
      - name: Rust audit (catalog-dedup — deep quality check)
        run: |
          command -v cargo >/dev/null 2>&1 || { echo "::error::cargo not found on the runner image"; exit 1; }
          cargo run --release --manifest-path tools/catalog-dedup/Cargo.toml -- audit \
            --input out/food-catalog.db.gz \
            --report out/catalog-audit-report.json
        working-directory: scripts/food-catalog

      - name: Export the importable SQL (data-only, idempotent upserts)
        run: |
          VERSION="$(bun -e "console.log(JSON.parse(require('fs').readFileSync('out/catalog-manifest.json','utf8')).version)")"
          bun export-sql.ts --db=out/food-catalog.db --out=out/food-catalog.sql --version="$VERSION"
        working-directory: scripts/food-catalog

      - name: Validate acceptance criteria (count band · zero critical-missing · replay idempotency · determinism · size cap)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun validate.ts \
              --audit-report=out/catalog-audit-report.json \
              --expected-count="${{ inputs.expected_count }}" \
              --max-deviation-pct="${{ inputs.max_deviation_pct }}"
          else
            bun validate.ts --audit-report=out/catalog-audit-report.json
          fi
        working-directory: scripts/food-catalog

      - name: Job summary (documented deviation record)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          v = json.loads(pathlib.Path("scripts/food-catalog/out/validation-report.json").read_text())
          b = json.loads(pathlib.Path("scripts/food-catalog/out/build-report.json").read_text())
          # 539: core-source liveness — the band documents drift, it never
          # masks a dead core source; exceptions are documented, non-blocking.
          def _core_failures(v):
              core = v.get("coreSourceHealth") or {}
              return ", ".join(
                  f"{x['id']} ({x['reason']})" for x in core.get("failures", [])
              )
          def _core_exceptions(v):
              core = v.get("coreSourceHealth") or {}
              return ", ".join(
                  f"{e['id']}[{e['kind']}]: {e['rawRecords']} raw{' FAILED' if e.get('failed') else ''}"
                  for e in core.get("exceptions", [])
              ) or "none"
          lines = [
            "## Food catalog build (F3-a) — acceptance gate",
            "",
            f"- **Foods:** {v['actualFoodCount']} (reference {v['expectedReferenceCount']}; deviation {v['deviationPct']}% — band ±{v['maxDeviationPct']}%: {'MET' if v['deviationWithinBand'] else 'BREACHED'})",
            f"- **Core sources:** {_core_failures(v) or 'all approved core sources alive (usda · national-tables · off-foodrepo · curated)'}",
            f"- **Documented exceptions (non-blocking):** {_core_exceptions(v)}",
            f"- **Critical missing rows:** {v['criticalMissingRows']} (must be 0)",
            f"- **SQL artifact:** {v['sqlBytes'] / 1024 / 1024:.2f} MB (cap {v['sqlMaxBytes'] / 1024 / 1024:.0f} MB)",
            f"- **Replay idempotency:** pass1 {v['replayRowCounts']['pass1']} / pass2 {v['replayRowCounts']['pass2']} (duplicated {v['replayRowCounts']['duplicated']})",
            f"- **Export determinism:** {'identical' if v['exportDeterminism']['identical'] else 'DIFFERS'}",
            f"- **Rust audit:** inputFoodCount={v['rustAudit'].get('inputFoodCount')} quarantined={v['rustAudit'].get('quarantinedTotal')}",
            f"- **Adapter contributions (raw):** " + ", ".join(f"{a['id']}={a['rawRecords']}" for a in b['adapterContributions']),
            f"- **Peak RSS:** {v['peakRssBytes'] / 1024 / 1024:.0f} MB",
            f"- **Gate result:** {'ALL CRITERIA MET' if v['passed'] else 'FAILED — see validation-report.json'}",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
            with open(summary, "a") as fh:
                fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload catalog artifacts (for the F3-b import frame)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — pinned
        with:
          name: food-catalog-${{ github.run_id }}
          path: |
            scripts/food-catalog/out/food-catalog.sql
            scripts/food-catalog/out/food-catalog.db.gz
            scripts/food-catalog/out/catalog-manifest.json
            scripts/food-catalog/out/build-report.json
            scripts/food-catalog/out/validation-report.json
            scripts/food-catalog/out/catalog-audit-report.json
          retention-days: 30
