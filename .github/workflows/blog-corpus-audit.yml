# WHY: BLOG-CORPUS-AUDIT (SEO-RECOVERY-EXEC-2 E8, owner order 2026-11-01
# «أمر تنفيذ المرحلة التالية» — clause 3): the standing, measured
# counterpart-gap documentation + pair-parity check for the blog corpus.
#
# What it produces (read-only, zero writes):
#   1. The full corpus inventory (tiers, review state, pairing).
#   2. PAIR PARITY — every bidirectional hreflang pair quality-compared
#      (depth ratio / FAQ counts / authority links) with flags — the
#      «فحص النسختين والتأكد من تكافئهما» mandate as a measured artifact.
#   3. THE UNPAIRED LEDGER — every published article with no live
#      counterpart, with its counterpart-eligibility classification — the
#      «توثيق عدم وجود نظير حتى تتم معالجته» mandate. L-batches consume
#      the eligible entries.
#
# Channel law: dispatch-only (scheduling = a future owner decision, same
# pattern as bing-url-submission), read-only PostgREST GETs, the service
# key never leaves GitHub secrets, the run log carries slug-level metrics
# only (never full bodies). Output JSON is uploaded as a workflow artifact
# for the owner + appended to the job summary.
name: Blog corpus audit (dispatch-only)

on:
  workflow_dispatch: {}

concurrency:
  group: blog-corpus-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Run corpus inventory (read-only)
        run: |
          bun scripts/blog-runner/blog-corpus-inventory.mts > corpus-inventory.json
          echo "## Blog corpus audit — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -c 4000 corpus-inventory.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload inventory artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — pinned
        with:
          name: corpus-inventory
          path: corpus-inventory.json
          retention-days: 90
