name: Docs & schema parity gate

# ============================================================
# Phase 106 (2026-09-03) — owner: «عايز حل ثابت انها متحصلش تانى
# خصوصاً ان ملفات التوثيق دايما بتسبب مشاكل»
# Phase 107 (2026-09-03) — owner-approved knowledge operating
# system: adds docs_audit.py (STATE.md integrity · single-source
# number law for README/GUIDE · AGENTS.md duplicate-section guard ·
# phase equality STATE/PROGRESS/QA · slim living docs + archive).
#
# Born from two real incident classes:
#   1) Docs drift: README froze at Phase 81 while the product moved
#      to 103b (Phase 104 audit) — stale counts, stale registry range.
#   2) Mirror drift: the hand-written types.ts claimed phantom columns
#      (coach_presence.user_id · progress_photos.taken_on) that halted
#      the migration pipeline at 0064 v1 with 42703 and silently broke
#      app paths (Phase 99-run / Phase 105).
#
# This gate re-derives every documented count from the filesystem and
# re-audits migrations ↔ types.ts on EVERY push/PR — so neither class
# can merge silently again. Runs on GitHub's own runners, independent
# of any agent session or local workspace.
#
# Pure static analysis — no dependencies, finishes in seconds.
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: docs-parity-gate
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          fetch-depth: 0   # docs_audit B-check verifies STATE's recorded
                           # commit is an ancestor of HEAD — a shallow
                           # (depth-1) checkout lacks the parent objects
                           # and would fail the gate falsely

      # INDEX.md registry heading must equal the filesystem truth
      # (newest NNNN). README/GUIDE are number-FREE by law — that side
      # is enforced by docs_audit.py below.
      - name: Migration registry vs filesystem (docs_parity.py)
        run: python3 scripts/docs_parity.py --ci

      # Phase 107 knowledge gate: STATE.md integrity (≤100 lines ·
      # required sections · recorded commit is an ancestor of HEAD),
      # phase equality STATE/PROGRESS/QA, ZERO variable counts in
      # README/DEVELOPER_GUIDE (single-source law §3.8), no duplicate
      # section numbers in AGENTS.md (the duplicated §3.6 incident),
      # slim living docs with archive pointers.
      # Phase 215 truth checks (deep-audit P1-4): H worklog newest-on-
      # top (top-12 window order + newest-at-top + frozen tail ≤
      # 2026-09-15) · I governed-doc Last-updated vs git history
      # (forward-only from 2026-09-16) · J frozen-verbatim archive
      # integrity (archive/PROGRESS.md + QA_CHECKLIST.md untouched).
      - name: Knowledge operating system gate (docs_audit.py)
        run: python3 scripts/docs_audit.py --ci

      # Migrations ↔ types.ts mirror audit: fails on any NEW missing/
      # phantom table or column that is not part of the documented
      # accepted baseline embedded in the script (INDEX.md §3
      # boundaries + parser blind spots).
      - name: Migrations ↔ types.ts mirror audit (migration_audit.py --ci)
        run: python3 scripts/migration_audit.py --ci
