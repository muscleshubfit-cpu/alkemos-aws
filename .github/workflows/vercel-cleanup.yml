# Vercel stale-deployment purge — push-triggered + hourly backstop
# (Phase 145, owner directive 2026-09-08 · tightened VERCEL-USAGE-2
# 2026-09-16, owner order «المشكلة كبيرة» · tightened VERCEL-USAGE-4
# 2026-09-19, owner order «مطلوب تنفيذ حل لمشكلة تجاوز الاستخدام
# الحالية»: 2× daily schedule → hourly + KEEP_HOURS 6 → 3).
#
# WHY: the Hobby plan's "Function Storage" + "Deployment Storage" (10 GB
# each) count the retained bundles/artifacts of every kept deployment.
# This repo deploys on EVERY push to main, and the 2026-09-16 usage
# report showed BOTH quotas EXCEEDED (17.13 + 14.07 GB) with 49 retained
# deployments — the Phase-145 48h window mathematically cannot fit this
# deploy rate in 10 GB (~28 deploys/day × ~350 MB × 2 days ≈ 17 GB).
#
# WHAT: runs scripts/vercel-cleanup/vercel-cleanup.mjs — keeps the CURRENT
# production deployment (alkemos.com aliases) + the last KEEP_HOURS (3h
# default) + the newest KEEP_PREVIEWS (1) preview, DELETEs the rest.
# Superseded deployments are reproducible from git at any time.
#
# TRIGGERS (VERCEL-USAGE-4):
#   1. Every push to main — retention stays pinned at the 3h window floor
#      instead of drifting up between scheduled runs.
#   2. HOURLY (:07 UTC, offset clear of top-of-hour GitHub congestion) —
#      backstop that also purges after NON-push deploy sources (Vercel
#      dashboard "Redeploy", blog pipeline direct deployments) and
#      self-heals the GitHub cron-skew failure mode observed 2026-09-18
#      (scheduled runs landed 05:21/16:55 UTC vs the documented
#      01:00/13:00 — 4h+ drift while a 5-production-deploy burst piled
#      up inside the 6h window). Hourly runs cost
#      seconds and a handful of Vercel API calls; the workflow is a no-op
#      when nothing is stale. Supersedes the VERCEL-USAGE-2 2× daily
#      schedule (01:00 + 13:00 UTC).
#
# SCHEDULE HEALTH LAW (AGENTS.md §8): GitHub can silently de-register
# scheduled workflows repo-wide. The push trigger now self-heals most
# deregistration, but if blog/backup runs stop AND this workflow shows
# no recent runs, start with schedule forensics (GET
# /actions/runs?event=schedule) + a touching commit to re-register —
# "vercel stopped cleaning" is diagnosed the same way.
#
# SETUP (one-time, owner): repository secret VERCEL_TOKEN (Settings ▸
# Secrets and variables ▸ Actions). A project-scoped Vercel token is enough.
# Until the secret exists the preflight step fails fast with the exact fix.
name: Vercel cleanup (stale-deployment purge)

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      keep_hours:
        description: "Freshness window (hours) to always keep — default 3"
        type: string
        required: false
        default: ""
      keep_previews:
        description: "Newest preview deployments to always keep — default 1"
        type: string
        required: false
        default: ""
      dry_run:
        description: "DRY RUN — list keep/purge plan, delete nothing"
        type: boolean
        required: false
        default: false

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          # Node 22 — global fetch, zero-dependency runner (db-backup pattern).
          node-version: 22

      - name: Preflight — VERCEL_TOKEN secret present (fails fast, names the fix)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Missing secret VERCEL_TOKEN — add it under Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret (a project-scoped Vercel token is enough)"
            exit 1
          fi
          echo "✓ VERCEL_TOKEN present"

      - name: Purge stale deployments (keep production + fresh window + newest preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: alkemos
          # github.event.inputs.* are ALWAYS strings (''/value) — empty on
          # push/schedule events → the script's 6h/1 defaults apply.
          KEEP_HOURS: ${{ github.event.inputs.keep_hours }}
          KEEP_PREVIEWS: ${{ github.event.inputs.keep_previews }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/vercel-cleanup/vercel-cleanup.mjs

      - name: Summary
        if: always()
        run: |
          echo "=== Vercel cleanup summary ==="
          echo "GREEN run = purge completed (or nothing needed purging) — Deployment/Functions Storage stays within quota."
          echo "RED run   = a Vercel API call failed — scroll to the ✗ lines for the exact deployment UID + HTTP status."
          echo "DRY RUN   = plan-only run selected via workflow_dispatch (nothing was deleted)."
