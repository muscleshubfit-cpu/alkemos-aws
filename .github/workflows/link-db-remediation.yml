# WHY: Audit-2 (owner order 2026-09-29, option أ) — retroactive
# treatment of the OLD published corpus against CONFIRMED-DEAD citation
# links: the audit's live health-check (HEAD over every external link
# rendered on the 95 published pages) found 4 dead (404) links shown to
# visitors — the P5 link-verify gate checks links only at publish time,
# so published rows were never re-checked. The 4 curated patches live in
# scripts/blog-runner/link-db-patches.json (byte-exact finds extracted
# from the live DB; replacements pre-verified 200 live).
#
# Channel law (same as stats-db-remediation / content-audit-db-
# remediation / retro-pair-blog): dispatch-only, DRY_RUN=1 by default
# (plan report, zero writes), the service key never leaves GitHub
# secrets, every patch is byte-exact exact-match-fail-safe, replacement
# URLs are HEAD-checked BEFORE any write (confirmed-dead replacement
# aborts — never re-plant a dead link), re-runs are idempotent. Writes
# content/reading_time/updated_at ONLY (the cleanup-workflow write law).
# Production pages pick the patched content up via the 5-minute ISR
# revalidate.
name: Link DB remediation (audit-2 dead citations — dispatch-only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = plan only (zero writes) · 0 = apply to blog_posts"
        required: false
        default: "1"

concurrency:
  group: link-db-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          node-version: 22

      # Production-locked install (A-12): the same frozen bun.lock Vercel
      # and local dev build from — no npm fresh re-resolution drift.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Dead-citation link remediation (validated before any write)
        run: npx --no-install tsx scripts/blog-runner/link-db-remediation.mts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}

      - name: Summary
        if: always()
        run: echo "Link DB remediation finished — see the per-slug plan/report above."
