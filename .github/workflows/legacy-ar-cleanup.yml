name: Legacy AR MSA cleanup (Phase 175 — staged repair, not deletion)

# ============================================================
# PHASE 175 (owner order «ابدا التنظيف» 2026-09-11): execute the
# Arabic Legacy Content Cleanup recommendation recorded in STATE.md
# at 174 — convert every published AR article still carrying
# Egyptian/colloquial dialect into Pan-Arab Modern Standard Arabic.
#
# LAW: scripts/blog-runner/legacy-ar-msa.mts runs under the SAME
# Phase-174 MSA law as the editor tools (imported from
# src/lib/blog-msa.ts — no fork) and writes ONLY after the
# deterministic validateMsaConversion gate (links/images/headings/
# length/markers). Slug, title, publish state, images: never touched.
#
# One-off + staged: dispatch with dry_run first, then limit/slug
# batches, then the full queue. Idempotent — clean articles are
# skipped, so re-runs converge to a no-op. Production pages pick
# the new content up via the 5-minute ISR revalidate.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN — queue report only, zero AI calls, zero DB writes"
        type: boolean
        default: true
      limit:
        description: "Max queued articles to process (0 = the whole queue)"
        type: number
        default: 0
      slugs:
        description: "Comma-separated slug allowlist (empty = severity order)"
        type: string
        default: ""
      chunked:
        description: "CHUNKED — section-by-section conversion (the stubborn-article path: no compression, trivial format contract)"
        type: boolean
        default: false
      apply_patches:
        description: "APPLY manual MSA patches from scripts/legacy-msa-patches (validated by the same gate before any write)"
        type: boolean
        default: false
      faq_hygiene:
        description: "FAQ_HYGIENE (Phase 176) — deterministic faq_json repair pass: strip «السؤال؟» labels + drop off-topic questions vs title/focus + drop contaminated answers. No AI, never touches content."
        type: boolean
        default: false

concurrency:
  group: legacy-ar-msa
  cancel-in-progress: false

jobs:
  msa-cleanup:
    runs-on: ubuntu-latest
    # Batches of ~8 articles: successes take 2-4 min each, retries with
    # backoff up to ~15 min worst-case per article — 120 min funds a full
    # batch including transient-provider retries.
    timeout-minutes: 120

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # FULL-ARTICLE CONVERSION BUDGET (the blog-post workflows' own law:
      # default 52s budget is the Vercel serverless cap — a ~1000-word
      # article conversion needs the 150s-per-model window; first apply
      # run failed on 17s/model aborts until this was set).
      AI_CHAIN_TOTAL_BUDGET_MS: "360000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          node-version: 22

      # Production-locked install (A-12): the same frozen bun.lock Vercel
      # and local dev build from — no npm fresh-re-resolution drift.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Convert legacy AR articles to Pan-Arab MSA (validated before write)
        run: npx --no-install tsx scripts/blog-runner/legacy-ar-msa.mts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LIMIT: ${{ inputs.limit }}
          SLUGS: ${{ inputs.slugs }}
          CHUNKED: ${{ inputs.chunked && '1' || '0' }}
          PATCH_DIR: ${{ inputs.apply_patches && 'scripts/legacy-msa-patches' || '' }}
          FAQ_HYGIENE: ${{ inputs.faq_hygiene && '1' || '0' }}

      - name: Summary
        if: always()
        run: echo "Legacy AR MSA cleanup pass finished — see the per-slug report above."
