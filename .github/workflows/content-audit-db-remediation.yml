# WHY: CONTENT-AUDIT-REMEDIATION §4 (2026-09-28) — the DB-stored content
# items the remediation report documented as remaining: link-stuffing prose
# beyond the auto-fixed template family (audit §1.3), the planted Q/A
# pattern (§4.2), the cross-article cardio-question harmonization (§4.3),
# and the migration of the render-time compensation families (⑥⑦⑧ +
# BLOG_CATEGORY_OVERRIDES values) into the blog_posts rows themselves so the
# render layers can be unwound (§4.4 — single source of truth = the DB).
#
# Channel law (same as retro-pair-blog / legacy-ar-cleanup): dispatch-only,
# DRY_RUN=1 by default (plan report, zero writes), the service key never
# leaves GitHub secrets, every patch is exact-match-fail-safe, re-runs are
# idempotent. Production pages pick the new content up via the 5-minute
# ISR revalidate.
name: Content-audit DB remediation (§4 — dispatch-only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = plan only (zero writes) · 0 = apply to blog_posts"
        required: false
        default: "1"

concurrency:
  group: content-audit-db-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          node-version: 22

      # Production-locked install (A-12): the same frozen bun.lock Vercel
      # and local dev build from — no npm fresh re-resolution drift.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Content-audit §4 remediation (validated before any write)
        run: npx --no-install tsx scripts/blog-runner/content-audit-db-remediation.mts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}

      - name: Summary
        if: always()
        run: echo "Content-audit DB remediation finished — see the per-slug report above."
