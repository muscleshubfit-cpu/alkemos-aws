# WHY: BILINGUAL-EDITORIAL-444B (owner order 2026-11-06 — «إلغاء الاستثناءات:
# راجع كل المحتوى، بما فيه المحتوى المخزن في قاعدة البيانات»): the live blog
# corpus (139 published articles, both languages, stored in blog_posts) joins
# the bilingual editorial audit scope. This workflow is the read-only evidence
# channel — the session holds no direct Supabase credentials, so the repo's own
# service-role secret (GitHub Actions secrets) is the one channel that can read
# the truth, exactly like db-blog-state-inspect / blog-corpus-audit before it.
#
# SAFETY LAWS:
#   - workflow_dispatch ONLY — can never fire on schedule/push/PR.
#   - READ-ONLY by construction: scripts/blog-runner/editorial-db-audit.mts
#     issues plain PostgREST GETs (paginated) and prints findings + snippet
#     evidence (±45 chars) — never a full body, never any secret value.
#   - Zero writes: no UPDATE/INSERT/PATCH verb exists in the script.
#   - Output JSON is uploaded as a workflow artifact for the owner + the
#     human summary goes to the run log and the job summary.
name: Blog editorial audit (dispatch-only — read-only)

on:
  workflow_dispatch: {}

concurrency:
  group: blog-editorial-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Run the bilingual editorial audit (read-only)
        run: |
          bun scripts/blog-runner/editorial-db-audit.mts > editorial-audit.json 2> audit-summary.txt
          echo "## Blog editorial audit — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 6000 audit-summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — pinned
        with:
          name: editorial-audit
          path: |
            editorial-audit.json
            audit-summary.txt
          retention-days: 90
