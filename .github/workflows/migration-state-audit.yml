# Migration state audit (DB-MIGRATION-PIPELINE-2026-10-27)
#
# WHY THIS EXISTS — the 2026-10-27 incident (owner order: «عالج جذريًا
# مشكلة عدم تطبيق ترحيل Supabase تلقائيًا … لا تعتبر نجاح نشر الكود دليلًا
# على تطبيق ترحيلات قاعدة البيانات»):
#   The Supabase–GitHub integration applied migrations SILENTLY — zero
#   GitHub-side check runs, statuses or deployments — so nobody could see
#   it die. It last applied a migration on 2026-10-02 (0100, commit
#   5d3b3b2a — on the PRE-cutover repo); the alkemos-aws repo was created
#   2026-10-09 (AWS cutover) with the integration never re-linked, so 0101
#   (2026-10-25, the first migration on the new repo) and 0102 (2026-10-26)
#   piled up unapplied while the code that needed them kept deploying green. The admin list kept
#   showing client 87cd7ba6 as an EXPIRED premium because the pick lives
#   inside a DB function body 0102 redefines.
#
# WHAT THIS GATE DOES (read-only):
#   Runs scripts/db/migration_state.py — declarative probes
#   (scripts/db/migration_probes.py) against PRODUCTION via PostgREST:
#   schema fingerprints from the OpenAPI spec + row-state asserts + the
#   strongest class: behavioral probes through the app's own admin code
#   path (an EPHEMERAL QA admin session, auto-provisioned and deleted
#   within the run by scripts/db/probe_session.py — since the
#   QA-TEST-ACCOUNTS-CLOSE 2026-10-29 closure the gate carries no
#   persistent test-account dependency and no QA_PROBE_* secrets).
#   Verdict RED until the LATEST repo migration is proven applied.
#
#   Since ACCOUNTS-ORPHAN-AUDIT 2026-11-25 the same run ALSO executes
#   scripts/db/accounts_orphan_audit.py — the read-only auth.users ↔
#   profiles consistency check (auth-without-profile / profile-without-
#   auth / orphaned dependent rows; reserved-test-domain census). The
#   owner order behind it: after deleting test accounts from the admin
#   panel, the deletion's two failure shapes must be MEASURABLE, not
#   assumed — the same observability law as the migration probes.
#
# VISIBILITY LAW: on drift this gate (a) fails loudly, (b) files ONE
#   deduplicated issue (label migration-drift) with the evidence and the
#   two fix paths, so silent drift is structurally impossible again.
#
# Runs: every push to main + daily 06:10 UTC + manual dispatch.
name: Migration state audit (latest migration applied on prod?)

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

concurrency:
  group: migration-state-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: state probes (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (pinned v4 — 2026-10-10 audit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Probe production state (verdict from scripts/db/migration_probes.py)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MIGRATION_STATE_JSON: ${{ runner.temp }}/state.json
        run: |
          set +e
          python3 scripts/db/migration_state.py
          rc=$?
          echo "STATE_RC=$rc" >> "$GITHUB_ENV"
          exit 0  # the issue step below must still run on drift

      # ACCOUNTS-ORPHAN-AUDIT 2026-11-25: read-only auth.users ↔ profiles
      # consistency — runs AFTER the state probes so the 0102 fixture's
      # own create→probe→destroy cycle is already complete: any leftover
      # of that cycle (or of the owner's admin-panel deletions, or of any
      # crashed run) lands in this audit's buckets. Real data is never
      # deleted by anything here — detection only (AGENTS.md §3.3); the
      # qa.* channel leftovers self-heal via the cleanup_stale sweeps the
      # state step above already ran.
      - name: Accounts orphan audit (auth ↔ profiles — read-only)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/db/accounts_orphan_audit.py
          rc=$?
          echo "ORPHAN_RC=$rc" >> "$GITHUB_ENV"
          exit 0  # the final verdict below propagates it

      - name: File/dedupe the drift issue (evidence + fix paths)
        if: env.STATE_RC != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_JSON: ${{ runner.temp }}/state.json
          REPO: ${{ github.repository }}
        run: bash scripts/db/file_drift_issue.sh

      # The OTHER half of the issue's own lifecycle law ("stays open until
      # the state gate is green") — added 2026-11-10: issue #3 stayed open
      # for 5 consecutive GREEN days because nothing owned the closing half
      # (docs/MIGRATION-GATE-ISSUE3-RESOLUTION-2026-11-10.md). Closes every
      # OPEN migration-drift issue with the green evidence attached. Never
      # fails the gate itself: an API hiccup here must not falsify the DB
      # verdict — it surfaces as a step warning and the issue simply stays
      # open (the pre-2026-11-10 behavior).
      - name: Close the drift issue on green (evidence attached — lifecycle law)
        if: env.STATE_RC == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_JSON: ${{ runner.temp }}/state.json
          REPO: ${{ github.repository }}
        run: bash scripts/db/file_drift_issue.sh --close-on-green

      - name: Final verdict (propagates the probe exit code)
        if: ${{ always() }}
        run: |
          rc=0
          if [ "${STATE_RC:-2}" = "0" ]; then
            echo "migration state: GREEN"
          else
            echo "migration state: RED"
            rc=1
          fi
          if [ "${ORPHAN_RC:-2}" = "0" ]; then
            echo "accounts orphan audit: CLEAN"
          else
            echo "accounts orphan audit: ORPHANS DETECTED (see the audit step above)"
            rc=1
          fi
          exit $rc
