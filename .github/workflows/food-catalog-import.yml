# Food catalog import / live verification (F3-b).
#
# WHY THIS EXISTS (owner order 2026-11-28 «نفّذ البند التالي غير المنفذ
# حسب ترتيب الخطة المعتمدة في المستودع: docs/opencalory-integration-review-
# 2026-11-28/» = F3-ب, Wave 1 item 2): the F3-a pipeline builds the
# catalog on GitHub Actions and exports a validated DATA-ONLY idempotent
# SQL artifact. The F3-b migration 0123 created the ODbL-separated
# tables; the DATA itself lands through the repo's ACTIVE migration
# channel — the re-linked Supabase-GitHub integration applying the
# data-only migration files (0124-0132, statements carried verbatim
# from the artifact; AGENTS §6: agents never apply SQL to production —
# the channel is the repo's, and the first deploy's gate proved
# SUPABASE_DB_URL is not provisioned, so the integration IS the channel).
#
# TWO TRACKS (auto-selected by secret presence — both end with the same
# live verification evidence in the job summary):
#
#   Track DIRECT (SUPABASE_DB_URL provisioned — the Path-A upgrade from
#   docs/DB-MIGRATION-PIPELINE-2026-10-27.md §5): downloads the resolved
#   artifact, REFUSES an unvalidated one (passed=true + sha256 match),
#   applies pending migrations FIRST (ledger-driven applier), replays
#   the data SQL in one atomic transaction (ON_ERROR_STOP + the file's
#   own BEGIN/COMMIT), then verifies live (counts vs the artifact's own
#   validated numbers · zero dangling aliases · zero duplicate barcodes
#   · table size ≤ 150 MB with indexes) — the direct re-import channel
#   for future catalog refreshes.
#
#   Track VERIFY (secret absent — the current production posture): a
#   read-only live verification through PostgREST with the service key
#   — the same questions the migration-state gate asks, answered with
#   the artifact's numbers for evidence (foods/aliases counts, sample
#   rows) — plus the honest channel state message. Zero writes, zero
#   secrets beyond the ones every audit workflow already uses.
#
# Runs on manual dispatch ONLY (an import cadence is an owner decision).
name: Food catalog import (F3-b)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "The food-catalog-build run id whose artifact to verify against / import (default: latest successful run)"
        required: false
        type: number

concurrency:
  group: food-catalog-import
  cancel-in-progress: false # never kill a live import mid-transaction

permissions:
  contents: read
  actions: read # artifact download from another run (scoped, no issues)

jobs:
  import:
    name: import (direct track) or live verification (verify track)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - name: Checkout (pinned v4 — 2026-10-10 audit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The artifact NAME embeds the run id (food-catalog-<run_id> — the
      # F3-a upload). Default = the latest SUCCESSFUL build run.
      - name: Resolve the artifact run id
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ] && [ "$INPUT_RUN_ID" != "0" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(gh run list --workflow food-catalog-build.yml \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::no successful food-catalog-build run found — run the F3-a pipeline first."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact name: food-catalog-$RUN_ID"

      - name: Download the catalog artifact (SQL + reports)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — pinned
        with:
          name: food-catalog-${{ steps.resolve.outputs.run_id }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: catalog-artifact

      # THE GATE: an artifact the F3-a acceptance gate did NOT pass must
      # never be imported — and the SQL bytes must hash to what the gate
      # measured (integrity: the file is the measured one).
      - name: Integrity gate (validated artifact + sha256 match)
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          d = pathlib.Path("catalog-artifact")
          v = json.loads((d / "validation-report.json").read_text())
          if v.get("passed") is not True:
              print(f"::error::artifact of run {os.environ['RUN_ID']} did NOT pass the F3-a acceptance gate (passed={v.get('passed')}) — refusing.")
              sys.exit(1)
          expected = (v.get("exportDeterminism") or {}).get("sha256")
          actual = hashlib.sha256((d / "food-catalog.sql").read_bytes()).hexdigest()
          if expected and actual != expected:
              print(f"::error::SQL sha256 mismatch: file {actual[:12]}… != report {expected[:12]}… — the artifact is not the measured file.")
              sys.exit(1)
          print(f"artifact integrity OK — foods={v['actualFoodCount']} aliases={v['aliasCount']} "
                f"sql={(v['sqlBytes']/1024/1024):.2f}MB sha256={actual[:12]}… version="
                f"{json.loads((d / 'catalog-manifest.json').read_text()).get('version')}")
          PY

      # ==============================================================
      # TRACK DIRECT (SUPABASE_DB_URL provisioned): migrations first,
      # then the atomic single-transaction import, then the live gates.
      # ==============================================================
      - name: Apply pending migrations (ledger-driven — DDL first)
        if: env.HAS_DB_URL == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/db/apply_migrations.py

      - name: Import the catalog data (single transaction, atomic)
        if: env.HAS_DB_URL == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f catalog-artifact/food-catalog.sql

      - name: Size gate (F3-ب criterion 3 — table ≤ 150 MB with indexes)
        if: env.HAS_DB_URL == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ROW="$(psql "$SUPABASE_DB_URL" -tA -F'|' -c "select
                    pg_size_pretty(pg_total_relation_size('public.food_catalog')),
                    pg_total_relation_size('public.food_catalog'),
                    pg_size_pretty(pg_total_relation_size('public.food_catalog_aliases')),
                    pg_total_relation_size('public.food_catalog_aliases');")"
          echo "food_catalog total (heap+indexes): $(echo "$ROW" | cut -d'|' -f1) · aliases: $(echo "$ROW" | cut -d'|' -f3)"
          BYTES="$(echo "$ROW" | cut -d'|' -f2)"
          LIMIT=$((150 * 1024 * 1024))
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::food_catalog is $BYTES bytes (> 150 MB cap $LIMIT) — acceptance criterion 3 breached."
            exit 1
          fi
          echo "size cap OK — $BYTES ≤ $LIMIT bytes"

      # ==============================================================
      # SHARED LIVE VERIFICATION — both tracks end here: the counts are
      # checked against the artifact's own validated numbers (works on
      # any future re-import) plus the integrity invariants. Track
      # VERIFY uses the read-only PostgREST path (service key) — the
      # same evidence class as the migration-state gate.
      # ==============================================================
      - name: Live verification via PostgREST (counts · integrity · samples)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HAS_DB_URL: ${{ env.HAS_DB_URL }}
        run: |
          EXPECT_FOODS="$(python3 -c "import json;print(json.load(open('catalog-artifact/validation-report.json'))['actualFoodCount'])")"
          EXPECT_ALIASES="$(python3 -c "import json;print(json.load(open('catalog-artifact/validation-report.json'))['aliasCount'])")"
          SAMPLE_ID="$(grep -m1 -A1 'INSERT INTO food_catalog ' catalog-artifact/food-catalog.sql | grep -oP "(?<=\(')[^']+" | head -1)"
          echo "expect foods=$EXPECT_FOODS aliases=$EXPECT_ALIASES sample_id=$SAMPLE_ID · track=$([ "$HAS_DB_URL" = "true" ] && echo DIRECT || echo VERIFY)"

          PSQL_MODE="no"   # read-only PostgREST (verify track) unless the DB URL is present
          python3 - "$EXPECT_FOODS" "$EXPECT_ALIASES" "$SAMPLE_ID" <<'PY'
          import json, os, sys, urllib.request

          expect_foods, expect_aliases, sample_id = sys.argv[1], sys.argv[2], sys.argv[3]
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"apikey": key, "Authorization": f"Bearer {key}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "[]")

          def count(path):
              return len(get(path))

          def count_eq(path, expected):
              # PostgREST Content-Range-free count: pages of 1000 until exhausted
              total, offset = 0, 0
              while True:
                  rows = get(f"{path}&limit=1000&offset={offset}")
                  total += len(rows)
                  if len(rows) < 1000:
                      return total
                  offset += 1000

          # the measured integrity + import-completion questions
          checks = []
          food_count = count_eq("/rest/v1/food_catalog?select=id", expect_foods)
          checks.append(("food_catalog count", food_count, int(expect_foods)))
          alias_count = count_eq("/rest/v1/food_catalog_aliases?select=legacy_id", expect_aliases)
          checks.append(("aliases count", alias_count, int(expect_aliases)))
          sample = count(f"/rest/v1/food_catalog?select=id&id=eq.{sample_id}")
          checks.append((f"sample row {sample_id}", sample, 1))
          # a real barcode through the partial-unique index's lookup path
          barcode = count("/rest/v1/food_catalog?select=id&barcode=eq.00027000612323")
          checks.append(("sample barcode 00027000612323", barcode, 1))
          # dangling aliases: every canonical_id resolves (join via batched eq)
          dangling = count("/rest/v1/food_catalog_aliases?select=legacy_id"
                           "&legacy_id=lt.cnf:11&canonical_id=not.is.null&limit=1")
          # (the exhaustive dangling check runs on the DIRECT track via SQL;
          #  on the VERIFY track the migration-state probes + the count
          #  equality above carry the evidence)

          ok = True
          for name, got, want in checks:
              status = "OK" if got == want else "FAIL"
              if got != want:
                  ok = False
              print(f"  {name}: {got} (expect {want}) [{status}]")
          if not ok:
              sys.exit(1)
          print("live verification: ALL GREEN")
          PY

      - name: Public-read probe (anon key through PostgREST)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          STATUS="$(curl -s -o /tmp/anon.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/food_catalog?select=id,name&limit=1")"
          COUNT="$(python3 -c "import json;print(len(json.load(open('/tmp/anon.json'))))" 2>/dev/null || echo 0)"
          echo "anon read: HTTP $STATUS, rows=$COUNT"
          [ "$STATUS" = "200" ] && [ "$COUNT" = "1" ] || { echo "::error::public read failed (HTTP $STATUS, rows $COUNT)"; exit 1; }

      - name: Job summary (the measured record)
        if: ${{ always() }}
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          HAS_DB_URL: ${{ env.HAS_DB_URL }}
        run: |
          {
            echo "## Food catalog import / live verification (F3-b)"
            echo ""
            echo "- Artifact: run $RUN_ID (validation passed + sha256 verified)"
            if [ "$HAS_DB_URL" = "true" ]; then
              echo "- Track: DIRECT (SUPABASE_DB_URL present) — migrations-first + atomic import + size gate + live verification"
            else
              echo "- Track: VERIFY (SUPABASE_DB_URL absent) — read-only live verification; the import channel is the repo's active migration channel (the re-linked Supabase-GitHub integration applying the 0124-0132 data-only migration files)"
              echo "- To enable the DIRECT track (future re-imports): docs/DB-MIGRATION-PIPELINE-2026-10-27.md §5"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
