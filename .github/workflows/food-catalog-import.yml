# Food catalog import (F3-b) — the repo-owned data channel.
#
# WHY THIS EXISTS (owner order 2026-11-28 «نفّذ البند التالي غير المنفذ
# حسب ترتيب الخطة المعتمدة في المستودع: docs/opencalory-integration-review-
# 2026-11-28/» = F3-ب, Wave 1 item 2): the F3-a pipeline builds the
# catalog on GitHub Actions and uploads a validated DATA-ONLY idempotent
# SQL artifact; the F3-b migration (0123) creates the ODbL-separated
# tables + indexes + public-read RLS; THIS workflow is the only channel
# that lands the DATA on production — agents never apply SQL themselves
# (AGENTS §6/§3.3: the pipeline is the repo's channel, never an agent
# session). Patterned on db-migrate.yml's apply job (workflow_dispatch,
# ledger-aware, observable), it:
#
#   1. Resolves the artifact run (input id, or the latest successful
#      food-catalog-build run) and downloads it (the SAME validation
#      report the F3-a gate produced travels with the data).
#   2. REFUSES an unvalidated artifact: validation-report.json must say
#      passed=true AND the SQL file's sha256 must equal the report's
#      exportDeterminism.sha256 (integrity — the file is the one that
#      was measured).
#   3. Applies pending migrations FIRST (the ledger-driven applier —
#      idempotent, ordered; guarantees the 0123 DDL is live before any
#      data statement runs; a re-run is a no-op).
#   4. Replays the data SQL (psql + ON_ERROR_STOP; the file's own
#      BEGIN/COMMIT makes a mid-file failure atomic — the transaction
#      rolls back; every row is an upsert so re-runs never duplicate).
#   5. VERIFIES LIVE (the F3-ب acceptance criteria 3+5, measured, not
#      assumed): row counts == the artifact's own validated numbers ·
#      zero dangling aliases · zero duplicate barcodes · table size
#      ≤ 150 MB with indexes · the artifact's own first-row id and a
#      real barcode both resolve · the anon public-read policy works
#      end-to-end through PostgREST.
#
# Runs on manual dispatch ONLY (the owner's import decision — a cadence
# would be an owner decision, the same law as the build). Cost: a few
# minutes on a standard runner (68 MB SQL replay, single transaction).
name: Food catalog import (F3-b)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "The food-catalog-build run id whose artifact to import (default: latest successful run)"
        required: false
        type: number
      dry_run:
        description: "Resolve + download + integrity-check the artifact and apply pending migrations, but skip the data import"
        required: false
        type: boolean
        default: false

concurrency:
  group: food-catalog-import
  cancel-in-progress: false # never kill a live import mid-transaction

permissions:
  contents: read
  actions: read # artifact download from another run (scoped, no issues)

jobs:
  import:
    name: import + live verification (SUPABASE_DB_URL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (pinned v4 — 2026-10-10 audit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The artifact NAME embeds the run id (food-catalog-<run_id> — the
      # F3-a upload). Default = the latest SUCCESSFUL build run, so the
      # import always lands a gate-passing artifact by construction.
      - name: Resolve the artifact run id
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ] && [ "$INPUT_RUN_ID" != "0" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(gh run list --workflow food-catalog-build.yml \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::no successful food-catalog-build run found — run the F3-a pipeline first."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact name: food-catalog-$RUN_ID"

      - name: Download the catalog artifact (SQL + reports)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — pinned
        with:
          name: food-catalog-${{ steps.resolve.outputs.run_id }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: catalog-artifact

      # THE GATE: an artifact the F3-a acceptance gate did NOT pass must
      # never land on production — and the SQL bytes must hash to what
      # the gate measured (integrity: the report and the data travel in
      # the same zip, but the hash proves the SQL is the measured file).
      - name: Integrity gate (validated artifact + sha256 match)
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          d = pathlib.Path("catalog-artifact")
          v = json.loads((d / "validation-report.json").read_text())
          if v.get("passed") is not True:
              print(f"::error::artifact of run {__import__('os').environ['RUN_ID']} did NOT pass the F3-a acceptance gate (passed={v.get('passed')}) — refusing to import.")
              sys.exit(1)
          expected = (v.get("exportDeterminism") or {}).get("sha256")
          actual = hashlib.sha256((d / "food-catalog.sql").read_bytes()).hexdigest()
          if expected and actual != expected:
              print(f"::error::SQL sha256 mismatch: file {actual[:12]}… != report {expected[:12]}… — the artifact is not the measured file.")
              sys.exit(1)
          print(f"artifact integrity OK — foods={v['actualFoodCount']} aliases={v['aliasCount']} "
                f"sql={(v['sqlBytes']/1024/1024):.2f}MB sha256={actual[:12]}… version="
                f"{json.loads((d / 'catalog-manifest.json').read_text()).get('version')}")
          PY

      # Idempotent + ordered + recorded (the deploy migrate job's own
      # script): guarantees the 0123 tables exist BEFORE any data row.
      - name: Apply pending migrations (ledger-driven — DDL first)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/db/apply_migrations.py

      - name: Dry run stops here (artifact resolved + migrations applied)
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry run — data import skipped by input."

      # The file carries its own BEGIN…COMMIT: with ON_ERROR_STOP any
      # mid-file error aborts the transaction (no partial import), and
      # every row is an upsert (ON CONFLICT DO UPDATE — re-runs never
      # duplicate; proven twice by the F3-a validate replay).
      - name: Import the catalog data (single transaction, atomic)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f catalog-artifact/food-catalog.sql

      # LIVE VERIFICATION — every number is measured against the
      # artifact's own validated report (self-consistent for any future
      # re-import), plus the F3-ب criteria: size cap, zero dangling
      # aliases, zero duplicate barcodes, sample rows, public read.
      - name: Live verification (counts · integrity · size cap · samples)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          EXPECT_FOODS="$(python3 -c "import json;print(json.load(open('catalog-artifact/validation-report.json'))['actualFoodCount'])")"
          EXPECT_ALIASES="$(python3 -c "import json;print(json.load(open('catalog-artifact/validation-report.json'))['aliasCount'])")"
          # the artifact's own first data row (self-consistent sample)
          SAMPLE_ID="$(grep -m1 -A1 'INSERT INTO food_catalog ' catalog-artifact/food-catalog.sql | grep -oP "(?<=\(')[^']+" | head -1)"
          echo "expect foods=$EXPECT_FOODS aliases=$EXPECT_ALIASES sample_id=$SAMPLE_ID"

          QUERY="select
                    (select count(*) from public.food_catalog) as foods,
                    (select count(*) from public.food_catalog_aliases) as aliases,
                    (select count(*) from public.food_catalog_aliases a
                       where not exists (select 1 from public.food_catalog f where f.id = a.canonical_id)) as dangling,
                    (select count(*) from (select barcode from public.food_catalog
                       where barcode is not null group by barcode having count(*) > 1) d) as dup_barcodes,
                    (select count(*) from public.food_catalog where id = '${SAMPLE_ID}') as sample;"
          ROW="$(psql "$SUPABASE_DB_URL" -tA -F'|' -c "$QUERY")"
          echo "measured: foods|aliases|dangling|dup_barcodes|sample = $ROW"

          FOODS="$(echo "$ROW" | cut -d'|' -f1)"
          ALIASES="$(echo "$ROW" | cut -d'|' -f2)"
          DANGLING="$(echo "$ROW" | cut -d'|' -f3)"
          DUPES="$(echo "$ROW" | cut -d'|' -f4)"
          SAMPLE="$(echo "$ROW" | cut -d'|' -f5)"

          [ "$FOODS" = "$EXPECT_FOODS" ] || { echo "::error::food_catalog count $FOODS != artifact $EXPECT_FOODS"; exit 1; }
          [ "$ALIASES" = "$EXPECT_ALIASES" ] || { echo "::error::aliases count $ALIASES != artifact $EXPECT_ALIASES"; exit 1; }
          [ "$DANGLING" = "0" ] || { echo "::error::$DANGLING dangling alias canonical_ids"; exit 1; }
          [ "$DUPES" = "0" ] || { echo "::error::$DUPES duplicated non-null barcodes (unique index violated)"; exit 1; }
          [ "$SAMPLE" = "1" ] || { echo "::error::artifact first row $SAMPLE_ID not found live"; exit 1; }

      - name: Size gate (F3-ب criterion 3 — table ≤ 150 MB with indexes)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ROW="$(psql "$SUPABASE_DB_URL" -tA -F'|' -c "select
                    pg_size_pretty(pg_total_relation_size('public.food_catalog')),
                    pg_total_relation_size('public.food_catalog'),
                    pg_size_pretty(pg_total_relation_size('public.food_catalog_aliases')),
                    pg_total_relation_size('public.food_catalog_aliases');")"
          echo "food_catalog total (heap+indexes): $(echo "$ROW" | cut -d'|' -f1) · aliases: $(echo "$ROW" | cut -d'|' -f3)"
          BYTES="$(echo "$ROW" | cut -d'|' -f2)"
          LIMIT=$((150 * 1024 * 1024))
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::food_catalog is $BYTES bytes (> 150 MB cap $LIMIT) — acceptance criterion 3 breached."
            exit 1
          fi
          echo "size cap OK — $BYTES ≤ $LIMIT bytes"

      # The RLS public-read policy, proven end-to-end through the app's
      # own anonymous path (PostgREST + anon key — exactly how members
      # will read the catalog once F1-أ wires the search).
      - name: Public-read probe (anon key through PostgREST)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          STATUS="$(curl -s -o /tmp/anon.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/food_catalog?select=id,name&limit=1")"
          COUNT="$(python3 -c "import json;print(len(json.load(open('/tmp/anon.json'))))" 2>/dev/null || echo 0)"
          echo "anon read: HTTP $STATUS, rows=$COUNT"
          [ "$STATUS" = "200" ] && [ "$COUNT" = "1" ] || { echo "::error::public read failed (HTTP $STATUS, rows $COUNT)"; exit 1; }

      - name: Job summary (the measured import record)
        if: ${{ always() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          {
            echo "## Food catalog import (F3-b)"
            echo ""
            echo "- Artifact: run $RUN_ID (validation passed + sha256 verified)"
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              psql "$SUPABASE_DB_URL" -tA -c "select '- Live: ' || count(*) || ' foods in public.food_catalog' from public.food_catalog" 2>/dev/null || true
              psql "$SUPABASE_DB_URL" -tA -c "select '- Aliases: ' || count(*) || ' rows in public.food_catalog_aliases' from public.food_catalog_aliases" 2>/dev/null || true
              psql "$SUPABASE_DB_URL" -tA -c "select '- Table size (heap+indexes): ' || pg_size_pretty(pg_total_relation_size('public.food_catalog')) from public.food_catalog limit 1" 2>/dev/null || true
              echo "- Verified: counts vs the artifact report · zero dangling aliases · zero duplicate barcodes · sample row · anon public read"
            else
              echo "- DRY RUN — data import skipped (migrations applied)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
