name: Process AI jobs (plans • tools • social — queue worker)

# ============================================================
# OWNER DIRECTIVE (2026-08-27): the ENTIRE AI system runs natively
# in GitHub Actions — same pattern as the blog pipeline. This worker
# drains the `ai_jobs` queue every 10 minutes:
#
#   plan_nutrition        → full nutrition plan (+2 alternatives/meal)
#   plan_workout          → weekly workout program (4–8 weeks framing)
#   meal_regenerate       → meal swap + 3 suggestions (tier-limited)
#   exercise_regenerate   → library-filtered injury-safe exercise swap
#   article_tool          → paraphrase | summarize | proofread | SEO |
#                           subheadings (+ legacy editor aliases)
#   article_generate      → coach full-article draft (title+markdown+meta+tags)
#   social_post           → facebook | instagram | x | linkedin × tone
#
# EVO chat NEVER runs here — it stays on Vercel streaming by directive.
# In-process execution via tsx (no Vercel hop, no 60s serverless cap);
# AI_CHAIN_TOTAL_BUDGET_MS=180000 funds long completions.
#
# EVENT-DRIVEN DISPATCH LAW (2026-08-28, AGENTS.md §8): enqueue routes
# PUSH-trigger this workflow via the GitHub API the moment a job lands —
# this cron is a BACKSTOP only. GitHub de-registered repo-wide scheduled
# workflows (this worker had ONE run ever) so the push path is what makes
# plan/article generation actually work in production.
# SCHEDULE-RE-REGISTRATION 2026-08-28: this touching commit re-asserts the
# */10 schedule per the SCHEDULE HEALTH LAW remedy.
# ============================================================

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Max jobs to process this run (1-25)"
        required: false
        default: "10"
  repository_dispatch:
    types: [process-ai-jobs]

# SCHEDULE-RE-REGISTRATION 2026-08-27: this */10 worker NEVER fired since
# its addition (0 runs) — same repo-wide scheduler de-registration that hit
# the blog pipelines. Remedy per AGENTS.md §8 SCHEDULE HEALTH LAW:
# API enable + this touching commit.

# SCHEDULE-RE-REGISTRATION 2026-10-10 (alkemos-aws cutover): 0 schedule-event
# runs since repo creation — same repo-wide scheduler de-registration as the
# 2026-08-27 incident (AGENTS.md §8 SCHEDULE HEALTH LAW). Remedy:
# API enable + this touching commit.

concurrency:
  group: ai-jobs-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # ── Native-execution budget override (default on Vercel: 52000) ──
      # PHASE 161.4 (2026-09-09, owner article-generation failure forensics,
      # run 34352443142): 180000 ÷ maxModels(5, article_generate) = 36s per
      # model — silently below the 70s caller intent and below the ~120s a
      # 1100-1400-word JSON article actually needs → every heavy model
      # aborted ("This operation was aborted") and the job died permanently.
      # The full-article baseline (blog-post-{en,ar}.yml) moved to 480000
      # with R3 (2026-09-29); 480000 here satisfies 480/4 = 120s × 4 buckets
      # exactly. Small jobs are unaffected — their effTimeout stays
      # caller-bound (45/60/70s).
      AI_CHAIN_TOTAL_BUDGET_MS: "480000"

      # ── Required secrets (preflight fails fast naming missing ones) ──
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # THIRD PROVIDER (2026-09-09 owner addition): NVIDIA NIM joins the
      # fallback-chain key bundle (integrate.api.nvidia.com, nvapi- keys).
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # ── GEMINI (Phase 343 arm — first-priority law CANCELLED 2026-10-31,
      #    Phase 5-A owner order «إلغاء قانون Gemini-First نهائيًا») ──
      # Optional BY DESIGN: gemini rides the generation chains as an
      # ordinary TAIL entry (never a lead — the 3-way rotation leads).
      # Missing/empty → the chain skips the gemini entry without consuming
      # attempt budget (no preflight — the hard-required floor stays
      # GROQ + NVIDIA exactly as before).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Gemini usage counters (weekly report source) — optional, fail-soft.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # IMAGE BUNDLE (2026-08-28i): article_generate now sources its cover +
      # body photos through the safe Pexels pipeline inside this runner.
      # Optional: absent key degrades gracefully to imageless drafts.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - name: Preflight — required secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GROQ_API_KEY NVIDIA_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              echo "   → add it under: Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing AI provider key — provide a secret named OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ All required secrets present"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          # Node 22 REQUIRED: supabase-js realtime needs the stable global
          # WebSocket that only exists from Node 22+ (2026-08-27 crash).
          # (checkout@v5/setup-node@v5 run on Node 24 internally — the old
          # v4 "Node 20 is deprecated" log warnings are gone, 2026-08-28d.)
          node-version: 22

      # PHASE 141 (A-12) — production-locked install: bun reads the SAME
      # bun.lock Vercel and local dev build from, killing the npm
      # fresh-re-resolution drift class (and the 2026-09-03 npm-10
      # arborist crash + npm-11 workaround that fought it). Node stays
      # the RUNTIME — the tsx/npx steps below are unchanged.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Drain ai_jobs queue (reap stale → claim → process → write results)
        # REGEN-RELIABILITY FIX 2026-10-24 (owner order item 2 — the measured
        # root from the LIVE run 40091765755 logs): the runner executes
        # server code through tsx under plain Node conditions, where the
        # `server-only` package resolves to its THROWING default export —
        # so src/lib/plan-food-grounding (→ foods.ts, guarded `server-only`)
        # failed to import on EVERY runner run since AI-PLAN-QUALITY
        # («food grounding unavailable (continuing without)» in all three
        # 11:52/11:54/11:56 UTC runs) and the food-library grounding
        # (owner order item 3) was silently DEAD in the ONLY production AI
        # path. Adding the react-server resolution condition — exactly the
        # condition Next's own server runtime resolves `server-only` under
        # (its package.json: react-server → empty.js) — makes the import
        # resolve to the same empty module it does on the server, so
        # grounding is LIVE in the runner. Verified locally: the import
        # loads, the full processor graph loads (9 processors), and
        # groundItemToLibrary returns real library rows (150g chicken
        # breast 600→248). The guard's client-bundle purpose is untouched:
        # the Next build still resolves it to the throwing build for
        # client components.
        env:
          NODE_OPTIONS: "--conditions=react-server"
        run: npx --no-install tsx scripts/ai-jobs-runner/process.mts --max "${{ github.event.inputs.max_jobs || '10' }}"

      - name: Summary
        if: always()
        run: |
          echo "=== AI jobs worker summary ==="
          echo "GREEN run = every claimed job landed (done=N failedPermanent=0)."
          echo "RED run   = at least one job FAILED PERMANENTLY — open the run and"
          echo "            scroll to the ✗ lines above for the exact reason."
          echo "Provider notice/retry lines inside a GREEN run are normal fallback-"
          echo "chain behavior, not failures."
