name: Grounded failover test (AI providers)

# ============================================================
# BLOG-PROVIDER-FAILOVER 2026-10-16 — dispatch-only LIVE probe for
# the cross-provider grounded-search failover (owner order «اختبر
# التبديل الفعلي»): REAL calls with the REAL provider keys, NO
# code changes, NO deploy, NO schedule.
#
# Measures (scripts/ai-grounded-failover-probe.mts):
#   1. Each grounded arm separately — exa search API (+ /contents
#      full-text deepening + chain synthesis — PHASE 5-B 2026-10-31,
#      the EN-ladder leader) · tavily search API (+ chain synthesis —
#      PHASE 5-A, the AR-ladder leader / EN arm #2) · groq browser_search
#      · gemini googleSearch ladder (dormant arm). The openrouter web
#      plugin is probed for DIAGNOSTICS ONLY (removed from the effective
#      ladder — dead default model + paid plugin).
#      (NVIDIA: excluded by design — its chat API has no web-search
#      tool; printed as such.)
#   1b. The Phase-4 §13-6 complementary measurement: ONE Exa search
#      restricted to authority domains (includeDomains) — the result
#      domains + honored share printed for human inspection (~$0.004).
#   2. The end-to-end callGroundedSearch walk — TWICE, once per §6-أ
#      language ladder (EN: exa → tavily → groq → gemini dormant · AR:
#      tavily → groq → exa(EN-equivalent query) → gemini dormant).
#      THE verdict: green iff EVERY walk got a live-search-grounded
#      answer from some provider.
#   3. The generation chain failover (P1/P2/P4-class — post-5-A the
#      3-way rotation leads; gemini rides the tail slot).
#   4. The quota-cooldown registry state (futile-repeat avoidance —
#      AI_PROVIDER_COOLDOWN_MS is ON here exactly like the blog
#      workflows, so the probe demonstrates the live skip too).
#
# QUALITY LAW (owner decision #7, Phase 5-A): connection success is NOT
# evidence of research quality — the probe prints the SOURCE URLS and an
# answer sample for owner inspection; the evidence counts are the
# quality-visible part of the verdict.
#
# Discipline (aws-ai-test precedent): prints provider/model names,
# durations, statuses, evidence counts and short snippets ONLY — no
# secret values, no personal data. Honest exit: 1 iff an end-to-end
# walk produced no grounded answer (per-arm failures are measurements
# and never fatal).
# ============================================================

on:
  workflow_dispatch:

# MINIMAL permissions: contents:read is REQUIRED for actions/checkout
# (the aws-ai-test/gsc "permissions: {}" precedent works only because
# those instruments never check the repo out — they SSH/probe instead).
# Everything beyond repo read-access stays revoked.
permissions:
  contents: read

concurrency:
  group: grounded-failover-test
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Same cooldown window as the blog pipelines (the probe must run
      # EXACTLY the production wiring of the failover mechanism).
      AI_PROVIDER_COOLDOWN_MS: "1800000"

      # ── Provider keys (the EXISTING secrets — no new keys, owner law) ──
      # EXA_API_KEY (PHASE 5-B 2026-10-31): the search-arm secret created
      # by the owner for the Phase-3 live battery — now the FIRST arm of
      # the §6-أ EN ladder and the third arm of the AR ladder (semantic
      # search + optional /contents full-text deepening on the free
      # $10/month recurring credit; NO card, NO paid service). Absent →
      # the arm reports an honest configuration failure (never fatal — a
      # measurement).
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      # TAVILY_API_KEY (PHASE 5-A 2026-10-31): the search-arm secret created
      # by the owner for the Phase-3 live battery — the FIRST arm of the AR
      # §6-أ ladder and second on EN (free Researcher plan, basic
      # search = 1 credit; NO paid service). Absent → the arm reports an
      # honest configuration failure (never fatal — a measurement).
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      # ── Gemini usage counters (fail-soft; keeps the weekly report fed) ──
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - name: Preflight — provider secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight [grounded-failover-test]: checking provider secrets ==="
          missing=0
          for v in GROQ_API_KEY NVIDIA_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing secret: OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠ GEMINI_API_KEY absent — the dormant gemini arm will report a configuration failure (honest, not fatal)"
          fi
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "⚠ TAVILY_API_KEY absent — the tavily arm (AR-ladder leader) will report a configuration failure (honest, not fatal)"
          fi
          if [ -z "$EXA_API_KEY" ]; then
            echo "⚠ EXA_API_KEY absent — the exa arm (EN-ladder leader) will report a configuration failure (honest, not fatal)"
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ Required provider secrets present"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Run the live grounded-failover probe (REAL provider calls)
        run: npx --no-install tsx scripts/ai-grounded-failover-probe.mts
