name: Anti-regression guard (stale refs)

# ============================================================
# 2026-08-27 — born from two real incidents:
#   1) v2 dispatch died at step 0 because the runner still carried a
#      legacy v1 exemption ("step1-pick") days after v1 was retired.
#   2) Owner-visible "edits vanish / revert": retired Vercel-AI routes
#      kept running parallel to the ai_jobs queue.
#
# This workflow fails FAST on any push/PR that reintroduces retired
# identifiers (deleted API routes, dead components, old step names),
# on broken UI wiring, and (R6, 2026-10-31) on AI-router registry
# violations (engine calls outside the center, unregistered dispatch
# ids, dead registrations).
# The retirement contract itself lives in AGENTS.md §8:
#   retiring anything = git rm + caller sweep + comment cleanup,
#   in the SAME commit that removes it.
#
# Mostly grep (seconds); the R6 registry-completeness stage needs the
# real registry via tsx, so dependencies are installed (frozen lockfile).
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: stale-ref-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      # R6 (2026-10-31): the registry-completeness stage imports the REAL
      # ai-registry via tsx — needs node_modules (frozen lockfile, the
      # quality-gate pattern; install only, no build).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock — tsx for the R6 stage)
        run: bun install --frozen-lockfile

      - name: Scan for retired identifiers
        run: bash scripts/check-stale-refs.sh --ci

      # PROJECT-WIDE PREVENTION LAW (2026-08-28, owner: «محتاج اتاكد ان
      # مفيش مشاكل مشابهة تحصل مستقبلا فى المشروع كله») — fails the build
      # on: dead fetch targets, unregistered job types, job types without
      # processors, JOB_GATE gaps, and dishonest runner exits.
      - name: Scan for broken UI wiring (buttons → routes → processors)
        run: bash scripts/check-ui-wiring.sh

      # AI-ROUTER REGISTRY GUARD (R6 of the approved unification plan,
      # 2026-10-31 — audit §9-ت1 + §7 R6 row): after the R3/R4/R5 family
      # migrations EVERY production AI call rides dispatchAI/dispatchGrounded
      # — this step keeps it that way and keeps the registry complete:
      #   1) sole door — no engine call (callFreeAIFallbackChain /
      #      callGroundedSearch / callAI*) outside ai-provider.ts,
      #      ai-router.ts and the __tests__ canaries;
      #   2) no unregistered dispatch id (verified through the REAL
      #      resolveRegistrySpec — never a regex replica);
      #   3) no dead registration (every registry id reached directly, via
      #      a language/family template, or as a declared ت4 engine twin).
      # Observation-only (zero behavior); rollback = remove this step
      # (documented in docs/CI_GATES.md).
      - name: Scan for AI-router registry violations (sole door + completeness)
        run: bash scripts/check-ai-router-guard.sh
