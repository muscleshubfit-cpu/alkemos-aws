name: Recipes — daily bilingual pair (atomic publish)

# ============================================================
# HEALTHY-RECIPES-PLATFORM (owner order 2026-11-10 «Alkemos Healthy
#   Recipes – Full Implementation» — plan §6.3):
#
#   ONE workflow · ONE pair per run · ATOMIC publish. The Arabic and
#   English versions of a recipe are authored INDEPENDENTLY (never a
#   translation) from one shared structure, share ONE image file, and
#   publish in a single database transaction (publish_recipe_pair) —
#   «ممنوع نشر نسخة منفردة» is enforced IN THE DATABASE, not by
#   pipeline discipline (decision ق2 — stronger than the blog's
#   tolerant degradation).
#
# DAILY SLOT: cron 06:30 UTC = 08:30 Cairo (winter) — after the AR
#   blog (05:00 UTC) and before the visitor peak (the plan's
#   proposed window). Kill switch: RECIPES_PUBLISH_ENABLED (R6 reads
#   it; default true). Circuit breaker: 3 consecutive failed days →
#   R0/R6 auto-skip with an admin notification (plan §11-8).
#
# ANTI-DOUBLE-PUBLISH (plan §11-2, three layers): the
#   recipes_one_per_day_uidx partial unique index (structural),
#   countPublishedPairsOnDay (layer check), and this workflow's
#   concurrency group (no parallel runs).
#
# Execution: scripts/recipes-runner/run-step.sh — the blog-runner
#   pattern (in-process route handlers, Bearer CRON_SECRET, service
#   role; R1 repair contract ≤2 cycles then honest held/failed).
# ============================================================

on:
  schedule:
    - cron: "30 6 * * *" # 08:30 Cairo (winter) — the daily pair slot
  workflow_dispatch:
    inputs:
      queue_id:
        description: "Optional queue row id to resume (the admin Requeue button resets the row; empty = r0 resumes/creates the day's row)"
        required: false
        default: ""

concurrency:
  # One pair per day — never two pipeline runs in parallel.
  group: recipes-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── Native-execution budget (the blog law) ──
      AI_CHAIN_TOTAL_BUDGET_MS: "600000"

      # ── Quota-cooldown window (the blog law) ──
      AI_PROVIDER_COOLDOWN_MS: "1800000"

      # ── Optional targeted rerun (admin-triggered dispatch only) ──
      QUEUE_ID: ${{ github.event.inputs.queue_id || '' }}

      # ── The kill switch (plan §11-8; default true = publishing on) ──
      RECIPES_PUBLISH_ENABLED: ${{ secrets.RECIPES_PUBLISH_ENABLED || 'true' }}

      # ── Required secrets (preflight fails fast naming missing ones) ──
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      # ── Optional provider arms (fail-soft — the blog law) ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # ── Image sources (Pexels primary — law v3) ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      # ── R7 indexing (IndexNow — optional, warn-only) ──
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      SITE_URL: "https://alkemos.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit

      - name: Preflight — required secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight [recipes pipeline]: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CRON_SECRET GROQ_API_KEY NVIDIA_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              echo "   → add it under: Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing AI provider key — provide a secret named OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ All required secrets present · pipeline=recipes"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned
        with:
          # Node 22 REQUIRED: supabase-js realtime needs the stable global
          # WebSocket that only exists from Node 22+ (2026-08-27 P0 crash).
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      # ══════════════════════════════════════════════════════════
      # EIGHT-STAGE PIPELINE — ONE PAIR (each stage retries ×3 with
      # backoff and threads queueId automatically from r0's response;
      # R5 gate failures carry the RERUN_TARGET repair contract)
      # ══════════════════════════════════════════════════════════

      - name: R0 — Idea of the day (coverage matrix + guards)
        run: bash scripts/recipes-runner/run-step.sh r0-idea 3

      - name: R1 — Structure JSON (zod + N-GATE-1/2, creates the pair)
        run: bash scripts/recipes-runner/run-step.sh r1-structure 3

      - name: R2 — Programmatic nutrition (no AI — the deterministic engine)
        run: bash scripts/recipes-runner/run-step.sh r2-nutrition 3

      - name: R3 — Independent AR + EN authoring (two dispatchAI calls)
        run: bash scripts/recipes-runner/run-step.sh r3-authoring 3

      - name: R4 — Image (Pexels→Unsplash→Pixabay + match verification)
        run: bash scripts/recipes-runner/run-step.sh r4-image 3

      - name: R5 — Deterministic gate battery (hold or pass, never bend)
        run: bash scripts/recipes-runner/run-step.sh r5-gates 3

      - name: R6 — Atomic publish (publish_recipe_pair + ISR flush)
        run: bash scripts/recipes-runner/run-step.sh r6-publish 3

      - name: R7 — Indexing (IndexNow + sitemap lastmod — warn-only)
        run: bash scripts/recipes-runner/run-step.sh r7-indexing 3

      - name: Summary
        if: always()
        run: |
          echo "=== recipes pipeline run summary ==="
          echo "QUEUE_ID processed: ${QUEUE_ID:-<none>}"
          echo "Kill switch (RECIPES_PUBLISH_ENABLED): ${RECIPES_PUBLISH_ENABLED:-true}"
          echo "R1 repair-loop cycles this run: ${REPAIRS_USED:-0}"
          echo "Full logs above — green ✓ = one pair published (AR + EN together), red ❌ = copy last lines and report."
