name: Quality gate (tsc • eslint • vitest)

# ============================================================
# PHASE 141 (2026-09-07) — audit A-13: the repo's quality commands
# (AGENTS.md §3.5: npx tsc --noEmit → npx eslint . → vitest) ran
# ONLY in agent sessions. Nothing on GitHub enforced them, so a
# human push (or an undisciplined agent) could land red code on
# main with only Vercel's build (which does NOT run tsc or the
# unit suite) as a late, partial signal.
#
# This gate runs the EXACT canonical commands on every CODE push to main
# and every CODE PR — GitHub-side, independent of any local workspace.
#
# PHASE 290 (2026-09-28 — ARCH-REMEDIATION, audit P2-1 / Part C §5):
# PATH-SCOPED — docs-only pushes skip this gate. A commit touching only
# Markdown/docs/archive/workflows/scripts cannot change a tsc/eslint/
# vitest outcome (Vercel runs no unit tests either), yet 46 docs-only
# [vercel skip] commits each burned the full battery + a Supabase
# Preview. The docs gates (docs-parity-gate.yml + guard-stale-refs.yml)
# stay on EVERY push unchanged — they are cheap, static, and ARE the
# docs gates. workflow_dispatch stays for manual runs of any commit.
#
# PHASE 141 (A-12) install discipline: dependencies come from
# `bun install --frozen-lockfile` — the SAME bun.lock Vercel and
# local dev use. The previous CI pattern (fresh `npm install` from
# registry metadata, no lockfile) could resolve a DIFFERENT tree
# than production; frozen Bun kills that drift class.
#
# Runtime stays Node (setup-node 22) — the canonical commands run
# through npx/node exactly as documented in AGENTS.md.
# ============================================================

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'archive/**'
      - '.github/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'archive/**'
      - '.github/**'
      - 'scripts/**'
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      # Node 22 — runtime for the npx-based canonical commands.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          node-version: 22

      # Bun pinned to the repo's local version (A-12) — install only.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      # PHASE 141.1 (post-first-run fix): next-env.d.ts is a GITIGNORED
      # fresh-clone artifact (Phase 119 lesson) — only `next build/dev`
      # regenerates it, and the static-image module type declarations
      # (next/image-types/global) live there. A bare tsc in a clean checkout
      # fails every image import with TS2307 (first CI run 34078054217).
      # Write the standard stub deterministically; the .next/types imports
      # only exist after a build and are not part of --noEmit verification.
      - name: Regenerate next-env.d.ts (gitignored fresh-clone artifact)
        run: |
          printf '%s\n' \
            '/// <reference types="next" />' \
            '/// <reference types="next/image-types/global" />' \
            '' \
            '// NOTE: This file should not be edited' \
            '// see https://nextjs.org/docs/app/api-reference/config/typescript for more information.' \
            > next-env.d.ts

      - name: Typecheck — npx tsc --noEmit
        run: npx --no-install tsc --noEmit

      - name: Lint — npx eslint .
        run: npx --no-install eslint .

      - name: Unit tests — vitest run
        run: npx --no-install vitest run

      - name: Summary
        if: always()
        run: |
          echo "=== Quality gate summary ==="
          echo "Commands (AGENTS.md §3.5): tsc --noEmit · eslint . · vitest run"
          echo "Install: bun install --frozen-lockfile (bun.lock = production tree)"
          echo "A red step here means main is broken — fix before merging anything."
