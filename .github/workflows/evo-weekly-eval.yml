name: EVO weekly eval (quality harness)

# ============================================================
# EVO-5 (docs/EVO-MASTER-PLAN.md §4 W5.2 — eval harness):
#
#   A fixed reference set of AR/EN questions is answered with the REAL
#   production system prompt (anonymous baseline) via the standard
#   3-provider chain, then scored by a cheap judge model on the SAME
#   chain. One evo_eval_runs row per question (migration 0081) — the
#   quality curve that accompanies every prompt change, surfaced on
#   /admin/evo-analytics.
#
#   NOT deterministic (calls live models) → needs the provider keys,
#   same env family as process-ai-jobs.yml. THURSDAY 21:00 UTC = Friday
#   00:00 Africa/Cairo — a mid-week curve point away from the Sunday
#   knowledge refresh (evo-weekly-learning.yml).
# ============================================================

on:
  schedule:
    - cron: "0 21 * * 4"
  workflow_dispatch: {}

# SCHEDULE-RE-REGISTRATION 2026-10-10 (alkemos-aws cutover): 0 schedule-event
# runs since repo creation — same repo-wide scheduler de-registration as the
# 2026-08-27 incident (AGENTS.md §8 SCHEDULE HEALTH LAW). Remedy:
# API enable + this touching commit.

concurrency:
  group: evo-weekly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned 2026-10-10 audit (pre-enable hardening)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 — pinned 2026-10-10 audit (pre-enable hardening)
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Preflight — Supabase + at least one provider key present
        run: |
          echo "=== Preflight: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$NVIDIA_API_KEY" ]; then
            echo "❌ Missing provider keys: need at least one of OPENROUTER_API | OPENROUTER_API_KEY | GROQ_API_KEY | NVIDIA_API_KEY"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ Supabase + provider keys present"

      - name: Run the eval harness (answers + judge + persist)
        run: npx --no-install tsx scripts/ai-jobs-runner/evo-eval.mts

      - name: Summary
        if: always()
        run: |
          echo "=== EVO weekly eval summary ==="
          echo "GREEN run = reference questions scored, rows persisted to evo_eval_runs."
          echo "RED run   = missing env, judge/answer errors, or zero scored questions."
          echo "The curve is visible on /admin/evo-analytics (EVO quality section)."
