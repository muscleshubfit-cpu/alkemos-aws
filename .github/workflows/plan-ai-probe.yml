name: Plan AI quality probe (real provider — dispatch only)

# ============================================================
# PLAN-REGEN-CONSTRAINTS 2026-10-24 (owner order item 4: «استخدم
# مزودًا حقيقيًا واحدًا على الأقل في اختبار توليد مضبوط… مع ميزانية
# اختبار مخصصة للمزودين عند الحاجة، ولا تستهلك أرصدة العملاء»).
#
# Dispatch-ONLY measuring instrument — the same discipline as
# grounded-failover-test.yml: REAL provider calls with a SYNTHETIC
# client fixture (keto · allergies · 1800 kcal target), the full
# generation → quality-gate → independent-audit path, plus ONE meal
# regeneration under the same constraints. ZERO DB writes (§3.3): no
# ai_jobs rows, no plans rows, NO ai_plan_usage rows — a client's
# balance or plan is never touched; only the site's own provider
# budget is spent (~2 chain calls per dispatch).
#
# EXIT LAW: red iff the real chain fell back to the local generator,
# OR the independent audit raised a critical finding on the live
# result — the paid quality bar, measured live, honestly.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      budget_ms:
        description: "AI chain total budget ms (default 300000)"
        required: false
        default: "300000"

concurrency:
  group: plan-ai-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AI_CHAIN_TOTAL_BUDGET_MS: ${{ github.event.inputs.budget_ms || '300000' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps (frozen)
        run: bun install --frozen-lockfile

      - name: Run the real-provider plan quality probe
        # SAME invocation law as process-ai-jobs.yml's drain step: the
        # react-server condition keeps the server-only imports (the food
        # library inside plan-food-grounding) resolvable under tsx —
        # the PLAN-TRIO F2-a law.
        env:
          NODE_OPTIONS: "--conditions=react-server"
        run: npx --no-install tsx scripts/plan-ai-probe.mts

      - name: Summary
        if: always()
        run: |
          echo "=== Plan AI quality probe ==="
          echo "GREEN = a real provider delivered a keto plan + keto meal swap"
          echo "that passed the full quality gate AND the independent audit."
          echo "RED = local fallback or a critical audit finding — open the run"
          echo "for the exact 🔴 lines."
