[package]
name = "catalog-dedup"
version = "0.1.0"
edition = "2021"
description = "High-speed multi-threaded food catalog analyzer, deep deduplicator, and SQLite FTS5 compactor for openCalory"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
